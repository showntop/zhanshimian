            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WardrobeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWardrobeItem
      summary: 新建衣橱单品
      description: 先传图（POST /v1/media，kind=wardrobe）后建档，或 media_id 缺省纯文字建档。
      tags: [Wardrobe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category, color]
              properties:
                media_id:
                  type: string
                  description: 单品照片媒体 ID（kind=wardrobe，选填）
                name:
                  type: string
                  description: 单品名称
                category:
                  type: string
                  description: 类目（如 上衣/裤装/鞋履/配饰）
                color:
                  type: string
                  description: 主色
                season:
                  type: string
                  description: 季节（选填）
                formality:
                  type: string
                  description: 正式度（选填）
                scenes:
                  type: array
                  items:
                    type: string
                  description: 适用场景（选填）
      responses:
        '201':
          description: 已创建
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/WardrobeItem'
