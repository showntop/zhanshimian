    get:
      operationId: listAdvisorMessages
      summary: 会话消息时间线
      description: 指定会话的消息列表（按时间正序）；越权访问一律 404。
      tags: [Advisor]
      parameters:
        - name: id
          in: path
          required: true
          description: 会话 ID
          schema:
            type: string
      responses:
        '200':
          description: 消息时间线
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AdvisorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/advisor/actions/{id}/apply':
    post:
      operationId: applyAdvisorAction
      summary: 应用顾问建议动作
      description: 应用顾问建议（如加入衣橱、调整方案步骤），返回 applied=true 的动作；幂等，重复应用不重复执行。
      tags: [Advisor]
      parameters:
        - name: id
          in: path
          required: true
          description: 动作 ID
          schema:
            type: string
      responses:
        '200':
          description: 已应用
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AdvisorAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/events':
    post:
      operationId: trackEvent
      summary: 埋点上报
      description: 产品埋点 fire-and-forget：202 即受理，客户端失败不重试、不阻塞业务流程。
      tags: [Events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: 事件名（如 plan_selected、checklist_completed）
                payload:
                  type: object
                  additionalProperties: true
                  description: 事件附加数据（选填）
      responses:
        '202':
          description: 已受理
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/EventAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
      description: 'Authorization: Bearer <token>，token 来自登录端点返回的 Session.token'

  headers:
    XRequestId:
      description: 请求追踪 ID（客户端可透传，服务端缺省自动生成；与错误体 request_id 一致）
      schema:
        type: string

  responses:
    BadRequest:
      description: 参数或请求体校验失败（error.code=validation_error）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未登录/会话过期（unauthorized）或微信登录凭证无效（wechat_code_invalid）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 触发限频（rate_limited 或 wechat_login_limited）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或越权访问（not_found，越权一律 404 不泄露存在性）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: 上游微信登录服务暂不可用（wechat_unavailable）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: 服务内部错误（internal_error）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Envelope:
      type: object
      description: '统一成功响应包装 {"data": ...}；各端点通过 allOf 覆写 data（以及 202/201 场景的 task）字段。'

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - wechat_code_invalid
            - wechat_login_limited
            - wechat_unavailable
            - rate_limited
            - internal_error
          description: 业务错误码（保留码 forbidden 当前契约内罕见）
        message:
          type: string
          description: 面向用户的中文错误信息
        request_id:
          type: string
          description: 请求追踪 ID，与 X-Request-ID 响应头一致

    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: 会话令牌（Bearer）
        expires_at:
          type: string
          format: date-time
          description: 过期时间（滑动续期：余量 <7 天自动续 30 天）
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: string
        nickname:
          type: string

    Identity:
      type: object
      required: [provider, identifier, created_at]
      properties:
        provider:
          type: string
          enum: [wechat_miniapp, wechat_app, apple, phone]
          description: 身份提供方
        identifier:
          type: string
          description: 脱敏展示的身份标识
        created_at:
          type: string
          format: date-time
          description: 绑定时间

    MeAccount:
      type: object
      required: [id, nickname, identities]
      properties:
        id:
          type: string
        nickname:
          type: string
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
          description: 多端身份列表（按绑定时间排序）

    UserProfile:
      type: object
      required: [height_cm, role, budget]
      properties:
        height_cm:
          type: integer
          minimum: 100
          maximum: 250
          description: 身高（厘米）
        role:
          type: string
          description: 职业/身份
        budget:
          type: string
          description: 置装预算区间
        weight_kg:
          type: number
          description: 体重公斤（选填）
        bust_cm:
          type: number
          description: 胸围厘米（选填）
        waist_cm:
          type: number
          description: 腰围厘米（选填）
        hip_cm:
          type: number
          description: 臀围厘米（选填）

    MediaAsset:
      type: object
      required: [id, kind, url, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [face, side, body, feedback, outfit, product, wardrobe, demo]
          description: 用途类型
        url:
          type: string
          format: uri
          description: 带 TTL 的签名访问地址（过期后需重新获取）
        created_at:
          type: string
          format: date-time

    TaskRef:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: 任务 ID（用于 GET /v1/tasks/{id} 轮询）
        type:
          type: string
          enum: [analysis, hair_preview, plan_look, today_look]
          description: 任务类型

    Task:
      type: object
      required: [id, type, status, progress, stage]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [analysis, hair_preview, plan_look, today_look]
        status:
          type: string
          enum: [queued, processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 进度百分比
        stage:
          type: string
          description: 当前阶段中文描述（如 照片检查/生成中/写库）
        error:
          $ref: '#/components/schemas/TaskError'
        result_ref:
          type: string
          description: 完成后指向的业务对象 ID（报告/方案/预览）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskError:
      type: object
      description: 仅 status=failed 时存在；照片不合格时 photo_reasons 逐图给出中文原因
      properties:
        code:
          type: string
          description: 失败原因代码
        message:
          type: string
          description: 面向用户的中文失败说明
        photo_reasons:
          type: array
          items:
            type: string
          description: 与提交媒体一一对应的照片不合格原因（空缺项表示该图合格）

    Analysis:
      type: object
      required: [id, status, progress, stage, created_at, updated_at]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
        scene:
          type: string
        preview_image_url:
          type: string
          format: uri
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        report_id:
          type: string
          description: 完成后生成的报告 ID
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Report:
      type: object
      required:
        - id
        - analysis_id
        - current_image_url
        - impression_tags
        - priority_title
        - priority_copy
        - findings
        - provider_version
        - generated_at
      properties:
        id:
          type: string
        analysis_id:
          type: string
        current_image_url:
          type: string
          format: uri
          description: 全身主图（签名地址）
        impression_tags:
          type: array
          items:
            type: string
          description: 整体印象标签
        priority_title:
          type: string
          description: 优先可提升点标题
        priority_copy:
          type: string
          description: 优先可提升点说明（「可提升点」式尊重表达，不打分）
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        provider_version:
          type: string
          description: AI 供应商/版本标识（demo 开头表示示例内容）
        generated_at:
          type: string
          format: date-time

    Finding:
      type: object
      required: [id, label, category, severity, detail, anchor_x, anchor_y]
      properties:
        id:
          type: string
        label:
          type: string
          description: 可提升点短标签
        category:
          type: string
          description: 分类（如 比例/色彩/轮廓）
        severity:
          type: string
          description: 优先级（非评分，用于排序）
        detail:
          type: string
          description: 具体说明
        photo:
          type: string
          enum: [face, side, body]
          description: 该观察来自哪张分析照片；锚点相对该照片定位。缺省表示历史数据（按 body 主图渲染）
        anchor_x:
          type: number
          description: 相对照片宽度的横轴锚点（0-1）
        anchor_y:
          type: number
          description: 相对照片高度的纵轴锚点（0-1）

    Plan:
      type: object
      required:
        - id
        - report_id
        - name
        - slug
        - image_url
        - recommended
        - descriptor
        - why
        - outcome_tags
        - difference_tags
        - sort
        - selected
      properties:
        id:
          type: string
        report_id:
          type: string
        scene:
          type: string
          description: 所属场景分组
        name:
          type: string
          description: 方案名
        slug:
          type: string
          description: 组内稳定标识（幂等 upsert 键之一）
        image_url:
          type: string
          format: uri
          description: 风格参考图（未生成本人搭配图时展示）
        current_image_url:
          type: string
          format: uri
          description: 分析用当前全身照
        generated_image_url:
          type: string
          format: uri
          description: AI 生成的本人搭配图（完成前缺省；展示须带「AI 风格预览」标识）
        generation_status:
          type: string
          enum: [queued, processing, completed, failed]
          description: 图片生成状态（由统一任务系统承载）
        generation_error:
          type: string
        look_provider:
          type: string
          description: 生成图供应商标识（demo 开头按示例处理）
        look_task:
          $ref: '#/components/schemas/Task'
        recommended:
          type: boolean
          description: 是否推荐方案
        descriptor:
          type: string
          description: 一句话风格定位
        why:
          type: string
          description: 推荐理由
        outcome_tags:
          type: array
          items:
            type: string
          description: 预期效果标签
        difference_tags:
          type: array
          items:
            type: string
          description: 与现状的差异标签
        sort:
          type: integer
        selected:
          type: boolean
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PlanStep'
          description: 执行步骤（详情场景返回）

    PlanStep:
      type: object
      required: [id, category, title, summary, sort]
      properties:
        id:
          type: string
        category:
          type: string
          description: 步骤类目（如 单品/配色/发型）
        title:
          type: string
        summary:
          type: string
        details:
          type: object
          additionalProperties: true
          description: 结构化步骤详情（JSON，结构随 category 变化）
        sort:
          type: integer

    ChecklistItem:
      type: object
      required: [id, plan_id, category, title, completed, sort]
      properties:
        id:
          type: string
        plan_id:
          type: string
        category:
          type: string
        title:
          type: string
        description:
          type: string
        meta:
          type: string
          description: 补充元信息（如参考链接说明）
        completed:
          type: boolean
        sort:
          type: integer

    FeedbackResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: 服务端统一产出的个性化承诺文案（G3）

    Diagnosis:
      type: object
      required:
        - id
        - kind
        - scene
        - conclusion
        - priority_title
        - priority_copy
        - tags
        - findings
        - saved
        - created_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [outfit, purchase]
        scene:
          type: string
        conclusion:
          type: string
          description: 一句话结论
        priority_title:
          type: string
        priority_copy:
          type: string
        tags:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisFinding'
        options:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisOption'
          description: 可执行建议（购单品场景为替代/搭配单品）
        saved:
          type: boolean
        provider_version:
          type: string
        created_at:
          type: string
          format: date-time

    DiagnosisFinding:
      type: object
      required: [label, category, tone]
      properties:
        label:
          type: string
        category:
          type: string
        tone:
          type: string
          description: 表达语气（保持尊重表达）
        anchor_x:
          type: number
          description: 相对照片的横轴锚点（0-1，选填）
        anchor_y:
          type: number
          description: 相对照片的纵轴锚点（0-1，选填）

    DiagnosisOption:
      type: object
      required: [id, name, image_url]
      properties:
        id:
          type: string
        name:
          type: string
        image_url:
          type: string
          format: uri
        note:
          type: string
        reason:
          type: string
          description: 推荐理由
        tags:
          type: array
          items:
            type: string

    HairStyle:
      type: object
      required: [id, name, image_url]
      properties:
        id:
          type: string
          description: 发型 ID（用于创建预览的 style_id）
        name:
          type: string
        image_url:
          type: string
          format: uri
        note:
          type: string
          description: 适配说明
        reason:
          type: string
          description: 推荐理由
        tags:
          type: array
          items:
            type: string

    HairPreview:
      type: object
      required:
        - id
        - status
        - progress
        - stage
        - style_id
        - style_name
        - scene
        - source_image_url
        - saved
        - created_at
        - updated_at
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed]
        progress:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
        style_id:
          type: string
        style_name:
          type: string
        scene:
          type: string
        source_image_url:
          type: string
          format: uri
        result_image_url:
          type: string
          format: uri
          description: 试戴结果图（完成前缺省；须带「AI 风格预览」标识）
        provider_version:
          type: string
        saved:
          type: boolean
        error_message:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TodayContext:
      type: object
      required: [date, city, condition, temperature, day_type, schedule]
      properties:
        date:
          type: string
          format: date
          description: 日期（本地时区）
        city:
          type: string
        condition:
          type: string
          description: 天气现象（晴/雨 等）
        temperature:
          type: integer
          description: 气温摄氏度
        day_type:
          type: string
          description: 日期类型（工作日/周末/节假日）
        schedule:
          type: string
          description: 日程识别结果

    TodayPlan:
      type: object
      required:
        - id
        - context
        - title
        - summary
        - image_url
        - steps
        - active
        - regenerate_count
        - generation_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        report_id:
          type: string
        context:
          $ref: '#/components/schemas/TodayContext'
        title:
          type: string
        summary:
          type: string
        image_url:
          type: string
          format: uri
          description: 风格参考图（本人搭配图生成期间的展示，须带「风格参考」标识）
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TodayPlanStep'
        active:
          type: boolean
          description: 是否当前生效
        feedback:
          type: string
          description: 用户反馈回显
        regenerate_count:
          type: integer
        generated_image_url:
          type: string
          format: uri
          description: 本人搭配图（today_look 任务完成后填充；须带「AI 风格预览」标识）
        generation_status:
          type: string
          enum: [queued, processing, completed, failed]
        look_provider:
          type: string
        generation_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TodayPlanStep:
      type: object
      required: [category, label, title, copy]
      properties:
        category:
          type: string
        label:
          type: string
          description: 步骤标签（如 单品/配色）
        title:
          type: string
        copy:
          type: string
          description: 步骤说明

    Share:
      type: object
      required:
        - id
        - token
        - source_type
        - source_id
        - snapshot
        - include_photo
        - revoked
        - expires_at
        - created_at
      properties:
        id:
          type: string
        token:
          type: string
          description: 公开访问令牌（拼入分享链接）
        source_type:
          type: string
          enum: [plan, today]
        source_id:
          type: string
        snapshot:
          type: object
          additionalProperties: true
          description: 创建时固化的内容快照（title/summary/image_url/label 等）
        include_photo:
          type: boolean
        revoked:
          type: boolean
        expires_at:
          type: string
          format: date-time
          description: 过期时间（过期后公开访问返回 404）
        created_at:
          type: string
          format: date-time

    ShareView:
      type: object
      description: 公开访问视角（不含 id/token 等管理字段）
      required: [source_type, snapshot, include_photo, expires_at]
      properties:
        source_type:
          type: string
          enum: [plan, today]
        snapshot:
          type: object
          additionalProperties: true
          description: 内容快照（图片 URL 为本次访问新签名的地址）
        include_photo:
          type: boolean
        expires_at:
          type: string
          format: date-time

    WardrobeItem:
      type: object
      required:
        - id
        - name
        - category
        - color
        - season
        - formality
        - scenes
        - image_url
        - favorite
        - wear_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
        media_id:
          type: string
          description: 关联媒体（纯文字建档时缺省）
        name:
          type: string
        category:
          type: string
        color:
          type: string
        season:
          type: string
        formality:
          type: string
        scenes:
          type: array
          items:
            type: string
        image_url:
          type: string
          format: uri
          description: 单品图（无图时为空字符串）
        favorite:
          type: boolean
        wear_count:
          type: integer
          description: 穿着次数（经 outfit/wear 累计）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WardrobeOutfit:
      type: object
      required: [id, title, note, context, item_ids, items, worn, created_at]
      properties:
        id:
          type: string
        title:
          type: string
        note:
          type: string
        context:
          $ref: '#/components/schemas/TodayContext'
          description: 创建时的上下文快照
        item_ids:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/WardrobeItem'
        worn:
          type: boolean
          description: 是否已标记穿着
        created_at:
          type: string
          format: date-time

    AdvisorMessage:
      type: object
      required: [id, conversation_id, role, content, created_at]
      properties:
        id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/AdvisorAction'
          description: 顾问回复携带的可执行动作（仅 assistant 消息）
        created_at:
          type: string
          format: date-time

    AdvisorAction:
      type: object
      required: [id, kind, label, payload, applied]
      properties:
        id:
          type: string
        kind:
          type: string
          description: 动作类型（如 add_wardrobe_item/adjust_plan_step）
        label:
          type: string
          description: 展示文案
        payload:
          type: object
          additionalProperties: true
          description: 动作参数（结构随 kind 变化）
        applied:
          type: boolean

    HomeBootstrap:
      type: object
      required: [active_tasks]
      properties:
        profile_summary:
          $ref: '#/components/schemas/UserProfile'
          description: 资料摘要（未填写时缺省）
        report:
          $ref: '#/components/schemas/Report'
          description: 最新报告（尚无报告时缺省）
        today_plan:
          $ref: '#/components/schemas/TodayPlan'
          description: 当前今日方案（无生效方案时缺省）
        active_tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          description: 进行中的任务（非空且页面可见时才批量轮询）
        recent_plan:
          $ref: '#/components/schemas/Plan'
          description: 最近选定/生成的方案（无方案时缺省）

    SmsRequestAck:
      type: object
      required: [sent, cooldown_seconds]
      properties:
        sent:
          type: boolean
          const: true
        cooldown_seconds:
          type: integer
          const: 60
          description: 再次请求需等待的秒数

    EventAck:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true

    HealthStatus:
      type: object
      required: [status, environment]
      properties:
        status:
          type: string
          const: ok
        environment:
          type: string
          description: 运行环境（development/staging/production）
        storage_provider:
          type: string
        weather_provider:
          type: string
        wechat_login_configured:
          type: boolean
        analysis_provider:
          type: string
        fallback_enabled:
          type: boolean
        hair_preview_provider:
          type: string
        outfit_diagnosis_provider:
