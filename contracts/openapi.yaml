      description: 读取预览状态与结果图（也可通过统一任务端点轮询）；越权访问一律 404。
      tags: [Hair]
      parameters:
        - name: id
          in: path
          required: true
          description: 预览 ID
          schema:
            type: string
      responses:
        '200':
          description: 预览详情
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HairPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/hair-previews/{id}/save':
    post:
      operationId: saveHairPreview
      summary: 收藏发型预览
      description: 收藏/取消收藏由 PATCH 语义收敛为「收藏」动作（重复调用幂等，不切换状态）；已收藏记录出现在 saved=true 列表。
      tags: [Hair]
      parameters:
        - name: id
          in: path
          required: true
          description: 预览 ID
          schema:
            type: string
      responses:
        '200':
          description: 已收藏（saved=true）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HairPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/today/context':
    get:
      operationId: getTodayContext
      summary: 今日上下文
      description: 天气 + 日程识别，作为今日方案生成输入；city/schedule 查询参数可覆盖定位与日程。
      tags: [Today]
      parameters:
        - name: city
          in: query
          required: false
          description: 覆盖城市（缺省用定位）
          schema:
            type: string
        - name: schedule
          in: query
          required: false
          description: 覆盖日程描述
          schema:
            type: string
      responses:
        '200':
          description: 今日上下文
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TodayContext'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/today/plans/current':
    get:
      operationId: getCurrentTodayPlan
      summary: 当前今日方案
      description: 当前生效的今日方案（active=true）；无生效方案时 data 为 null（客户端展示生成引导）。
      tags: [Today]
      responses:
        '200':
          description: 今日方案；不存在时 data 为 null
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/TodayPlan'
                          - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/today/plans':
    post:
      operationId: createTodayPlan
      summary: 生成今日方案
      description: 201 同步返回方案文字与风格参考图，并附 today_look 任务引用——本人搭配图异步生成，以 3000ms 轮询，完成后 image_url 切换为 generated_image_url。refresh=true 强制重生成（regenerate_count +1）。
      tags: [Today]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report_id:
                  type: string
                  description: 基于的报告（缺省用当前报告）
                city:
                  type: string
                  description: 覆盖城市（选填）
                schedule:
                  type: string
                  description: 覆盖日程（选填）
                refresh:
                  type: boolean
                  default: false
                  description: true 时强制重生成
      responses:
        '201':
          description: 方案已创建（文字即时可见）；task 为本人搭配图生成任务
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, task]
                    properties:
                      data:
                        $ref: '#/components/schemas/TodayPlan'
                      task:
                        $ref: '#/components/schemas/TaskRef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/today/plans/{id}/activate':
    post:
      operationId: activateTodayPlan
      summary: 激活今日方案
      description: 激活为「今日造型」（互斥，激活其他方案自动失效）；幂等。
      tags: [Today]
      parameters:
        - name: id
          in: path
          required: true
          description: 今日方案 ID
          schema:
            type: string
      responses:
        '200':
          description: 激活后的方案（active=true）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TodayPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/today/plans/{id}/feedback':
    post:
      operationId: submitTodayPlanFeedback
      summary: 今日造型反馈
      description: 一句话反馈，保存后回显在 TodayPlan.feedback；同一方案重复反馈以最后一次为准。
      tags: [Today]
      parameters:
        - name: id
          in: path
          required: true
          description: 今日方案 ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feedback]
              properties:
                feedback:
                  type: string
                  maxLength: 500
                  description: 反馈内容
      responses:
        '200':
          description: 已保存（含 feedback 回显）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/TodayPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/shares':
    post:
      operationId: createShare
      summary: 创建分享卡
      description: 为方案（plan）或今日造型（today）创建分享卡：内容在创建时固化为快照，include_photo 决定是否包含本人照片；过期时间见 expires_at。
      tags: [Shares]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_type, source_id]
              properties:
                source_type:
                  type: string
                  enum: [plan, today]
                  description: 分享来源类型
                source_id:
                  type: string
                  description: 来源资源 ID
                include_photo:
                  type: boolean
                  default: false
                  description: 是否包含本人照片
      responses:
        '201':
          description: 已创建；token 用于拼公开链接
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/shares/{token}':
    get:
      operationId: getShareByToken
      summary: 公开访问分享快照
      description: 无需鉴权的公开端点。token 无效、已撤销或已过期一律 404（不泄露存在性）；快照内图片 URL 每次访问重新签名。
      tags: [Shares]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: 分享令牌
          schema:
            type: string
            minLength: 20
      responses:
        '200':
          description: 分享快照（渲染分享落地页所需全部内容）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ShareView'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/shares/{id}':
    delete:
      operationId: revokeShare
      summary: 撤销分享
      description: 删除分享（撤销后公开链接立即 404）；幂等，重复撤销返回 404。
      tags: [Shares]
      parameters:
        - name: id
          in: path
          required: true
          description: 分享卡 ID
          schema:
            type: string
      responses:
        '200':
          description: 已撤销
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [revoked]
                        properties:
                          revoked:
                            type: boolean
                            const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/wardrobe/items':
    get:
