components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
      description: 'Authorization: Bearer <token>，token 来自登录端点返回的 Session.token'
  headers:
    XRequestId:
      description: 请求追踪 ID（客户端可透传，服务端缺省自动生成；与错误体 request_id 一致）
      schema:
        type: string
    ETag:
      description: 资源版本的强 ETag
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  responses:
    BadRequest:
      description: 参数或请求体校验失败（error.code=validation_error）
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 未登录/会话过期（unauthorized）或微信登录凭证无效（wechat_code_invalid）
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: 触发限频（rate_limited 或 wechat_login_limited）
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 资源不存在或越权访问（not_found，越权一律 404 不泄露存在性）
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    BadGateway:
      description: 上游微信登录服务暂不可用（wechat_unavailable）
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    PaymentUnavailable:
      description: 虚拟支付未开通（payment_unavailable）
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: 服务内部错误（internal_error）
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/XRequestId"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 幂等冲突或无效状态转换
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    PreconditionFailed:
      description: 资源版本冲突
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: 缺少 If-Match
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: 依赖服务暂不可用
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
  schemas:
    Envelope:
      type: object
      description: 统一成功响应包装；异步创建在顶层返回 data 与 operation。
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          "$ref": "#/components/schemas/Error"
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      - retryable
      properties:
        code:
          type: string
          enum:
          - validation_error
          - unauthorized
          - forbidden
          - not_found
          - wechat_code_invalid
          - wechat_login_limited
          - wechat_unavailable
          - rate_limited
          - insufficient_credits
          - payment_unavailable
          - internal_error
          - idempotency_key_required
          - idempotency_conflict
          - idempotency_in_progress
          - invalid_transition
          - execution_not_completed
          - version_conflict
          - precondition_required
          - capability_unavailable
          description: 业务错误码（保留码 forbidden 当前契约内罕见）
        message:
          type: string
          description: 面向用户的中文错误信息
        request_id:
          type: string
          description: 请求追踪 ID，与 X-Request-ID 响应头一致
        retryable:
          type: boolean
    Session:
      type: object
      required:
      - token
      - expires_at
      - user
      properties:
        token:
          type: string
          description: 会话令牌（Bearer）
        expires_at:
          type: string
          format: date-time
          description: 过期时间（滑动续期：余量 <7 天自动续 30 天）
        user:
          "$ref": "#/components/schemas/User"
    User:
      type: object
      required:
      - id
      - nickname
      properties:
        id:
          type: string
        nickname:
          type: string
    Identity:
      type: object
      required:
      - provider
      - identifier
      - created_at
      properties:
        provider:
          type: string
          enum:
          - wechat_miniapp
          - wechat_app
          - apple
          - phone
          description: 身份提供方
        identifier:
          type: string
          description: 脱敏展示的身份标识
        created_at:
          type: string
          format: date-time
          description: 绑定时间
    MeAccount:
      type: object
      required:
      - id
      - nickname
      - identities
      properties:
        id:
          type: string
        nickname:
          type: string
        avatar_url:
          type: string
          description: 账户展示头像；未设置时客户端回退形象档案图
        identities:
          type: array
          items:
            "$ref": "#/components/schemas/Identity"
          description: 多端身份列表（按绑定时间排序）
        billing:
          "$ref": "#/components/schemas/BillingSummary"
    UserProfile:
      type: object
      required:
      - height_cm
      - role
      - budget
      properties:
        height_cm:
          type: integer
          minimum: 100
          maximum: 250
          description: 身高（厘米）
        role:
          type: string
          description: 职业/身份
        budget:
          type: string
          description: 置装预算区间
        weight_kg:
          type: number
          description: 体重公斤（选填）
        bust_cm:
          type: number
          description: 胸围厘米（选填）
        waist_cm:
          type: number
          description: 腰围厘米（选填）
        hip_cm:
          type: number
          description: 臀围厘米（选填）
    MediaAsset:
      type: object
      additionalProperties: false
      required:
      - id
      - purpose
      - mime_type
      - byte_size
      - sha256
      - state
      - created_at
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - face
          - side
          - body
          - feedback
          - wardrobe
        mime_type:
          type: string
          enum:
          - image/jpeg
          - image/png
        byte_size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        state:
          type: string
          const: ready
        created_at:
          type: string
          format: date-time
    Diagnosis:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - scene
      - conclusion
      - priority_title
      - priority_copy
      - tags
      - findings
      - options
      - saved
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - outfit
          - purchase
        scene:
          type: string
        conclusion:
          type: string
        priority_title:
          type: string
        priority_copy:
          type: string
        tags:
          type: array
          items:
            type: string
        findings:
          type: array
          items:
            "$ref": "#/components/schemas/DiagnosisFinding"
        options:
          type: array
          items:
            "$ref": "#/components/schemas/DiagnosisOption"
        source_media:
          "$ref": "#/components/schemas/DisplayMedia"
        saved:
          type: boolean
        created_at:
          type: string
          format: date-time
    DiagnosisFinding:
      type: object
      required:
      - label
      - category
      - tone
      properties:
        label:
          type: string
        category:
          type: string
        tone:
          type: string
          description: 表达语气（保持尊重表达）
        anchor_x:
          type: number
          description: 相对照片的横轴锚点（0-1，选填）
        anchor_y:
          type: number
          description: 相对照片的纵轴锚点（0-1，选填）
    DiagnosisOption:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - media
      properties:
        id:
          type: string
          format: uuid
        name:
