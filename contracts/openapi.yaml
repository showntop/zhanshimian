    delete:
      operationId: deleteWardrobeItem
      summary: 删除衣橱单品
      description: 删除单品；已被搭配（outfit）引用时不阻塞删除，引用关系同步解除。幂等：不存在返回 404。
      tags: [Wardrobe]
      parameters:
        - name: id
          in: path
          required: true
          description: 单品 ID
          schema:
            type: string
      responses:
        '200':
          description: 已删除
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: object
                        required: [deleted]
                        properties:
                          deleted:
                            type: boolean
                            const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/wardrobe/outfits':
    post:
      operationId: createWardrobeOutfit
      summary: 组建搭配
      description: 把若干单品组成一套搭配，并固化当下上下文快照（天气/日程），供顾问与统计使用。
      tags: [Wardrobe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, item_ids]
              properties:
                title:
                  type: string
                  description: 搭配名称
                note:
                  type: string
                  description: 备注（选填）
                context:
                  $ref: '#/components/schemas/TodayContext'
                item_ids:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: 组成该搭配的单品 ID 列表
      responses:
        '201':
          description: 已创建（items 内嵌单品详情）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/WardrobeOutfit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/wardrobe/outfits/{id}/wear':
    post:
      operationId: wearWardrobeOutfit
      summary: 标记今天穿了
      description: outfit.worn 置 true 并为组内单品 wear_count +1；幂等，重复调用只记一次穿着。
      tags: [Wardrobe]
      parameters:
        - name: id
          in: path
          required: true
          description: 搭配 ID
          schema:
            type: string
      responses:
        '200':
          description: 更新后的搭配（含单品最新 wear_count）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/WardrobeOutfit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/advisor/messages':
    post:
      operationId: sendAdvisorMessage
      summary: 向形象顾问发消息
      description: 发送消息并同步获得顾问回复（含可应用的动作 actions）；conversation_id 缺省新开会话，可携带 report/today_plan 上下文。
      tags: [Advisor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                conversation_id:
                  type: string
                  description: 会话 ID（缺省新开）
                content:
                  type: string
                  maxLength: 2000
                  description: 用户消息
                report_id:
                  type: string
                  description: 关联报告（选填）
                today_plan_id:
                  type: string
                  description: 关联今日方案（选填）
      responses:
        '201':
          description: 顾问回复消息（role=assistant，actions 为可执行建议）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AdvisorMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

