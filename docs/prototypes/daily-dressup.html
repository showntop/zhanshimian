<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>等待方式 · 换装洗牌（活性 croquis · 分层衣装 · 飞卡上身）</title>
<style>
  :root{
    --ease:cubic-bezier(.2,.8,.2,1);
    --snap:cubic-bezier(.3,1.45,.5,1);   /* 上身回弹：先过冲再落 */
    --fly:cubic-bezier(.55,-.15,.25,1);  /* 飞卡：起步甩出去、终点收住 */
    --ink:#3F463C; --sage:#8E9A83; --terra:#B4553C;
    --paper:#F5F2EC;
    --g:#D9D0C1; /* 衣服当前色：配色维度改它，fill 层直接吃 */
  }
  *{box-sizing:border-box}
  body{background:#E8E4DC;font-family:system-ui,-apple-serif,PingFang SC;margin:0;padding:24px;
       display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--ink)}
  body.rm *{animation:none !important;transition:none !important}

  .card-wrap{width:750px;height:560px;position:relative;overflow:hidden;border-radius:18px;
        background:linear-gradient(160deg,#F5F2EC 0%,#E4DFD6 100%);
        box-shadow:0 10px 48px rgba(0,0,0,.13);display:flex}

  /* ================= 左：试衣间（拱形壁龛 + 活性 croquis） ================= */
  .fig{width:336px;height:100%;position:relative}
  .arch{position:absolute;left:50%;top:36px;transform:translateX(-50%);
        width:262px;height:486px;border:1.5px solid rgba(63,70,60,.22);
        border-radius:131px 131px 14px 14px;
        background:linear-gradient(170deg,#FBF9F4 0%,#EFECE3 100%)}
  .arch::after{content:'DRESSING · TODAY';position:absolute;right:-24px;top:120px;
        writing-mode:vertical-rl;font-size:9px;letter-spacing:.34em;color:rgba(63,70,60,.34)}
  .figsvg{position:absolute;inset:0;z-index:2;width:100%;height:100%}
  /* 衣料：fill 吃 --g（配色维度直接染，不走 mask）；缝线用衣色深一档 */
  .gf{fill:var(--g,#D9D0C1)}
  .gstroke{stroke:#423E35}
  /* 重心微晃：脚踝为轴 ±0.5deg，3.8s 一轮——人活着，但别抢戏 */
  .croquis{transform-origin:168px 505px;animation:sway 3.8s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(.45deg)}50%{transform:rotate(-.5deg)}}
  .croquis.pop{animation:pop .5s var(--ease)}
  @keyframes pop{0%{transform:rotate(0)}30%{transform:rotate(-1.6deg)}60%{transform:rotate(.9deg)}100%{transform:rotate(0)}}

  /* 分层衣装：默认收起；上身 = 从肩部落下 + 过冲回弹；instant = 快切闪换（不演出） */
  .garm{opacity:0;transform:scaleY(.66);transform-origin:168px 112px;
        transition:opacity .26s var(--ease),transform .5s var(--snap)}
  .garm.on{opacity:1;transform:none}
  .instant .garm,.instant .coif{transition:none !important}
  /* 发型同理，发根为轴 */
  .coif{opacity:0;transform:scaleY(.6);transform-origin:170px 34px;
        transition:opacity .24s var(--ease),transform .46s var(--snap)}
  .coif.on{opacity:1;transform:none}
  .hairmove{animation:hairswing 3.8s ease-in-out infinite;transform-origin:170px 40px}
  @keyframes hairswing{0%,100%{transform:rotate(.7deg)}50%{transform:rotate(-.7deg)}}

  /* 腰线（比例维度落在人物上） */
  .waistband{opacity:0;transition:opacity .3s var(--ease),transform .5s var(--snap)}
  .waistband.on{opacity:.95}

  /* ================= 右：候选池 ================= */
  .pool{flex:1;position:relative;display:flex;flex-direction:column;padding:40px 30px 34px}
  .dim-label{font-size:13px;letter-spacing:.2em;color:#8A9083;margin-bottom:6px;height:18px}
  .grid{flex:1;position:relative}
  .cand{position:absolute;left:0;top:0;border-radius:15px;background:#FFF;
        border:1.5px solid #DED8CD;overflow:hidden;will-change:transform,filter;
        transition:transform .2s var(--ease),filter .2s var(--ease),
                   box-shadow .35s var(--ease),border-color .35s var(--ease)}
  .cand .inner{width:100%;height:100%;border-radius:13px;overflow:hidden;background:#FFF;
        transition:transform .34s var(--ease),opacity .34s var(--ease),filter .34s var(--ease)}
  .cand .inner svg{width:100%;height:100%;display:block}
  .cand.pick{border-color:var(--sage);box-shadow:0 14px 34px rgba(142,154,131,.32);z-index:5}
  .cand.pick .inner{transform:scale(1.12)}
  .cand.rest .inner{transform:scale(.9);opacity:.32;filter:saturate(.55)}
  .cand.rest{border-color:#E4DFD6}
  .cand .tag{position:absolute;left:0;right:0;bottom:0;padding:3px 0 4px;text-align:center;
        font-size:10px;letter-spacing:.08em;color:#6B7364;background:rgba(255,255,255,.88)}

  /* 飞卡本体（WAAPI 驱动，只要一个壳） */
  .flycard{position:absolute;z-index:20;border-radius:14px;background:#FFF;
        border:1.5px solid var(--sage);box-shadow:0 16px 40px rgba(63,70,60,.28);overflow:hidden}
  .flycard svg{width:100%;height:100%;display:block}
  /* 落点涟漪 */
  .ring{position:absolute;z-index:19;width:120px;height:120px;margin:-60px 0 0 -60px;
        border-radius:50%;border:2px solid var(--sage);opacity:0;pointer-events:none}
  .ring.go{animation:ring .6s var(--ease) forwards}
  @keyframes ring{0%{transform:scale(.25);opacity:.9}100%{transform:scale(1.15);opacity:0}}

  .chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;min-height:26px}
  .chip{padding:5px 12px;border-radius:999px;background:#FFF;border:1px solid #DED8CD;
        font-size:11px;letter-spacing:.1em;color:#6B7364;opacity:0;transform:translateY(6px);
        transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .chip.on{opacity:1;transform:none}

  .caption{position:absolute;left:36px;bottom:26px;z-index:9}
  /* 人物穿到字幕区是常事：一圈纸色光晕保可读，别盖一块底板（要透气） */
  .caption .c1{font-size:23px;letter-spacing:.13em;color:var(--ink);transition:opacity .24s var(--ease);
        text-shadow:0 0 10px #F5F2EC,0 0 18px #F5F2EC,0 1px 3px rgba(245,242,236,.9)}
  .caption .c2{margin-top:7px;font-size:11px;letter-spacing:.15em;color:#6B7364;
        text-shadow:0 0 8px #F5F2EC,0 0 14px #F5F2EC}
  .badge{position:absolute;right:28px;top:22px;padding:6px 14px;border-radius:999px;font-size:12px;
        letter-spacing:.12em;background:rgba(255,255,255,.9);color:var(--ink);z-index:9}

  /* ================= 揭晓：右栏变海报 + 盖章，左边穿着最终搭配的她一直亮着 ================= */
  .reveal{position:absolute;top:0;bottom:0;right:0;width:414px;z-index:14;
        transform:translateX(102%);transition:transform .55s var(--ease);
        background:linear-gradient(155deg,#3B4A2E 0%,#28331F 100%);
        display:flex;flex-direction:column;justify-content:flex-end;padding:0 36px 40px}
  .reveal.on{transform:none}
  .reveal .ghost{position:absolute;right:18px;top:24px;writing-mode:vertical-rl;
        font-size:13px;letter-spacing:.5em;color:rgba(242,239,231,.28)}
  .reveal .rvt{font-size:27px;letter-spacing:.12em;color:#F2EFE7}
  .reveal .rvs{margin-top:10px;font-size:12px;letter-spacing:.16em;color:rgba(242,239,231,.72)}
  .reveal .chips{margin-top:16px}
  .reveal .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#F2EFE7}
  /* 印章：放大砸下 + 落定一沉。等了这么久，要有分量 */
  .stamp{position:absolute;right:34px;bottom:36px;width:74px;height:74px;border-radius:10px;
        border:3px solid rgba(240,225,215,.92);color:rgba(240,225,215,.95);
        display:flex;align-items:center;justify-content:center;
        font-size:24px;letter-spacing:.18em;writing-mode:vertical-rl;
        transform:scale(1.9) rotate(-14deg);opacity:0}
  .stamp.go{animation:stamp .5s cubic-bezier(.2,1.1,.3,1) .34s forwards}
  @keyframes stamp{0%{transform:scale(1.9) rotate(-14deg);opacity:0}
        62%{transform:scale(.94) rotate(-8deg);opacity:1}
        100%{transform:scale(1) rotate(-8deg);opacity:1}}
  .stamp::after{content:'';position:absolute;inset:4px;border:1px solid rgba(240,225,215,.5);border-radius:6px}

  .ctl{display:flex;gap:14px;align-items:center;font-size:14px;flex-wrap:wrap;justify-content:center}
  button,select{padding:7px 15px;border-radius:9px;border:1px solid var(--ink);background:transparent;
        color:var(--ink);cursor:pointer;font-size:14px}
  label{display:inline-flex;gap:6px;align-items:center}
  .hud{opacity:.65;font-variant-numeric:tabular-nums}
</style>
</head>

<script>
/* =====================================================================
   换装洗牌：左侧一个活的 croquis 分层换装，右侧候选卡洗牌。
   三个爽点：
   ① 快切阶段整柜衣服在她身上闪换（试衣闪切）——洗牌不只是牌在动；
   ② 选中的卡从牌堆飞到她身上，落点同时衣服「落下+回弹」+涟漪；
   ③ 揭晓不盖人物：右栏变海报+盖章，她穿着最终搭配一直亮着。
   ===================================================================== */

/* ---------- 数据 ---------- */
const LOOKS = [
  {key:'dress',  name:'A字连衣裙',  layers:['g-dress']},
  {key:'knit',   name:'针织+阔腿裤', layers:['g-knit','g-pants-wide']},
  {key:'crop',   name:'短上衣+高腰裤', layers:['g-crop','g-pants-high']},
  {key:'blazer', name:'西装叠穿',   layers:['g-blazer','g-pants-wide']},
];
const COLORS = [
  {name:'燕麦', hex:'#D9D0C1'}, {name:'砖红', hex:'#B4553C'}, {name:'墨绿', hex:'#3F5340'},
  {name:'藏蓝', hex:'#2F3E56'}, {name:'浅灰', hex:'#C6C4BE'}, {name:'驼色', hex:'#B08B5E'},
];
/* 腰线直接落在她的腰上（svg y）：夸张过的三档，动起来才看得清 */
const WAISTS = [{name:'高腰', y:165}, {name:'中腰', y:185}, {name:'低腰', y:212}];
const HAIRS = [
  {key:'long', name:'长直发'}, {key:'wave', name:'大波浪'},
  {key:'bun',  name:'丸子头'}, {key:'bob',  name:'齐耳短发'},
];
const TARGET = { look:0, color:1, waist:0, hair:1 };  /* 服务端下发的答案 */

/* ---------- DOM ---------- */
const $=id=>document.getElementById(id);
const card=$('card'), grid=$('grid'), chips=$('chips'), dimLabel=$('dimLabel');
const c1=$('c1'), badge=$('badge'), reveal=$('reveal'), rvs=$('rvs');
const garments=$('garments'), hairRoot=$('hairRoot'), croquis=$('croquis'), waistband=$('waistband');
const sp=$('sp'), dr=$('dr'), auto=$('auto'), rm=$('rm'), waitSel=$('wait');
let curLook=null, curColor=null;

let timers=[]; const clear=()=>{timers.forEach(clearTimeout);timers=[];};
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
function setText(t){ c1.style.opacity=0; later(()=>{c1.textContent=t;c1.style.opacity=1;},130); }

/* ---------- 上身/换发 ----------
   instant 由洗牌流程经 .instant 类统一管理（快切段全程开着），
   这里只管切图层；最终「穿上」的那一下 = 类已移除 → 走落下+回弹的过渡 */
function wearLook(key){
  const layers=LOOKS.find(l=>l.key===key).layers;
  garments.querySelectorAll('.garm').forEach(g=>
    g.classList.toggle('on', layers.includes(g.id)));
  curLook=key;
  paintColor(curColor);   /* 换装保色 */
}
function wearHair(key){
  hairRoot.querySelectorAll('.coif').forEach(h=>
    h.classList.toggle('on', h.id==='hair-'+key));
}
function paintColor(hex){
  curColor=hex;
  document.querySelector('.figsvg').style.setProperty('--g', hex||'#D9D0C1');
}
function boop(){ croquis.classList.remove('pop'); void croquis.offsetWidth; croquis.classList.add('pop'); }

/* ---------- 卡面（造型卡 = 衣服剪影本身，所见即所穿） ---------- */
function innerHTML(it){
  if(it.kind==='look'){
    const map={dress:'M30,14 C40,10 60,10 70,13 C74,26 72,38 66,48 C62,58 62,70 68,84 C74,98 80,108 84,116 C70,121 46,121 30,116 C34,107 40,97 44,86 C48,74 48,60 44,50 C38,38 28,26 30,14 Z',
      knit:'M30,14 C42,9 60,9 70,12 L68,44 L32,46 Z', crop:'M31,14 C43,9 61,9 70,12 L69,32 L32,34 Z',
      blazer:'M28,13 C42,7 60,7 72,11 L78,34 L72,74 L30,72 L26,32 Z'};
    const pants='M30,50 C30,72 29,96 30,118 L50,119 C50,96 50,72 50,52 Z M52,52 C52,74 52,98 53,118 L72,116 C71,94 70,70 69,50 Z';
    const extra=(it.key==='knit'||it.key==='blazer')?pants:(it.key==='crop'
      ?'M31,52 C31,74 31,98 32,118 L51,119 C51,96 51,72 50,53 Z M52,53 C52,75 53,99 54,117 L72,115 C71,93 70,69 69,51 Z':'');
    return '<div class="inner"><svg viewBox="0 0 104 124">'+
      '<path d="'+map[it.key]+'" fill="currentColor" color="#8E9A83" opacity=".85"/>'+
      (extra?'<path d="'+extra+'" fill="currentColor" color="#8E9A83" opacity=".6"/>':'')+
      '</svg></div><div class="tag">'+it.name+'</div>';
  }
  if(it.kind==='swatch') return '<div class="inner" style="background:'+it.hex+'"></div>'+
      '<div class="tag">'+it.name+'</div>';
  if(it.kind==='rule')
    return '<div class="inner"><svg viewBox="0 0 100 124">'+
      '<path d="M50,6 C38,6 30,14 30,26 L34,44 C37,60 36,76 33,92 L30,114 L70,114 L67,92 C64,76 63,60 66,44 L70,26 C70,14 62,6 50,6 Z" fill="#F5F2EB" stroke="#CFC8BA" stroke-width="2.4"/>'+
      '<line x1="22" y1="'+(it.y*0.62)+'" x2="78" y2="'+(it.y*0.62)+'" stroke="#8E9A83" stroke-width="5" stroke-linecap="round"/>'+
      '</svg></div><div class="tag">'+it.name+'</div>';
  if(it.kind==='hair'){
    const map={long:'M36,18 C28,34 30,56 32,80 C33,96 31,110 26,120 C38,124 48,120 50,112 C52,90 51,60 50,36 Z M36,18 C40,8 56,6 62,14 C68,22 66,34 60,38 C56,24 44,18 36,18 Z',
      wave:'M36,18 C28,34 30,56 32,80 C33,96 28,108 24,118 C34,122 34,110 42,116 C46,122 44,110 52,116 C56,120 54,108 50,104 C52,80 51,56 50,36 Z M36,18 C40,8 56,6 62,14 C68,22 66,34 60,38 C56,24 44,18 36,18 Z',
      bun:'M38,20 C42,8 58,6 64,14 C70,22 68,34 60,38 C56,24 44,18 38,20 Z M38,20 C33,32 35,48 40,58 L52,60 C56,48 55,32 52,22 Z',
      bob:'M36,16 C29,32 30,48 36,58 C42,66 54,68 62,62 C70,55 72,42 70,28 C68,14 58,6 48,7 C43,8 38,10 36,16 Z'};
    return '<div class="inner"><svg viewBox="0 0 104 124">'+
      '<path d="'+map[it.key]+'" fill="currentColor" color="#3B352B"/></svg></div><div class="tag">'+it.name+'</div>';
  }
  return '';
}

/* ---------- 维度（apply 只在飞卡落点那一刻生效 = 因果可见） ---------- */
const DIMS=[
  {key:'look', label:'在试造型', badge:'造型', target:TARGET.look,
   items:LOOKS.map(l=>({kind:'look',name:l.name,key:l.key})),
   apply(it){ wearLook(it.key,false); }, chip:it=>'造型 · '+it.name},
  {key:'color', label:'在调配色', badge:'配色', target:TARGET.color,
   items:COLORS.map(c=>({kind:'swatch',name:c.name,hex:c.hex})),
   apply(it){ paintColor(it.hex); boop(); }, chip:it=>'配色 · '+it.name},
  {key:'waist', label:'在找腰线', badge:'比例', target:TARGET.waist,
   items:WAISTS.map(w=>({kind:'rule',name:w.name,y:w.y})),
   apply(it){ waistband.setAttribute('transform','translate(0,'+it.y+')');
              waistband.classList.add('on'); boop(); }, chip:it=>'比例 · '+it.name},
  {key:'hair', label:'在换发型', badge:'发型', target:TARGET.hair,
   items:HAIRS.map(h=>({kind:'hair',name:h.name,key:h.key})),
   apply(it){ wearHair(it.key,false); }, chip:it=>'发型 · '+it.name},
];

/* ---------- 网格（沿用：自适应列数永远排满） ---------- */
const CW=104, CH=124, GAP=16;
let cards=[], pos=[], order=[];
function buildGrid(items){
  grid.innerHTML='';
  const n=items.length, cols=n<=3?n:(n===4?2:3), rows=Math.ceil(n/cols);
  const gw=cols*CW+(cols-1)*GAP, gh=rows*CH+(rows-1)*GAP;
  const W=grid.clientWidth||390, H=grid.clientHeight||300;
  pos=[];
  for(let i=0;i<n;i++) pos.push([Math.round((W-gw)/2+(i%cols)*(CW+GAP)),
                                Math.round((H-gh)/2+Math.floor(i/cols)*(CH+GAP))]);
  cards=items.map(it=>{ const d=document.createElement('div');
    d.className='cand'; d.style.width=CW+'px'; d.style.height=CH+'px';
    d.innerHTML=innerHTML(it); grid.appendChild(d); return d; });
  order=[...Array(n).keys()];
  render(0,0);
}
function render(rot,blur){
  cards.forEach((c,i)=>{ const p=pos[order[i]];
    const r=(rot&&rot[i])?rot[i]:0;
    c.style.transform='translate('+p[0]+'px,'+p[1]+'px) rotate('+r+'deg)';
    c.style.filter=blur?'blur('+blur+'px)':'none'; });
}

/* ---------- 洗牌：衰减跳位；快切段衣服跟着闪换（试衣闪切） ---------- */
function shuffle(dim,done){
  const n=cards.length, decay=+dr.value;
  let d=+sp.value, steps=0;
  garments.classList.add('instant'); hairRoot.classList.add('instant');
  const step=()=>{
    for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
    const idx=(d>=330)?dim.target:(steps%n);
    /* 快切段：instant 闪切上身；最后一下留给飞卡落点演「穿上」 */
    if(dim.items[idx]&&d<330){
      if(dim.key==='look') wearLook(dim.items[idx].key);
      if(dim.key==='hair') wearHair(dim.items[idx].key);
      if(dim.key==='color') paintColor(dim.items[idx].hex);
    }
    const bl=d<110?5.5:(d<180?3.5:(d<250?1.5:0));
    render(cards.map(()=>(Math.random()*2-1)*7),bl);
    steps++; d=Math.round(d*decay);
    if(d>=330||steps>16){
      order=[...Array(n).keys()]; render(0,0);
      /* 快切结束：撤掉 instant，最终上身才有过冲回弹 */
      garments.classList.remove('instant'); hairRoot.classList.remove('instant');
      later(()=>{
        const pickI=dim.target;
        cards.forEach((c,i)=>{c.classList.toggle('pick',i===pickI);
                              c.classList.toggle('rest',i!==pickI);});
        later(()=>flyCard(cards[pickI],dim,done),200);
      },180);
      return;
    }
    later(step,d);
  };
  step();
}

/* ---------- 飞卡上身：卡飞向她，落地即穿 + 涟漪 ---------- */
function flyCard(el,dim,done){
  const wrap=card.getBoundingClientRect(), r=el.getBoundingClientRect();
  const cl=el.cloneNode(true); cl.className='flycard';
  Object.assign(cl.style,{left:(r.left-wrap.left)+'px',top:(r.top-wrap.top)+'px',
    width:r.width+'px',height:r.height+'px'});
  /* 落点：她胸口（fig 列 1:1 对 svg 坐标） */
  const dx=152-(r.left-wrap.left+r.width/2), dy=150-(r.top-wrap.top+r.height/2);
  card.appendChild(cl);
  /* 动画只管视觉；完成回调用 timer 驱动（onfinish 无头环境不可靠，小程序无 WAAPI） */
  cl.animate([
    {transform:'translate(0,0) rotate(0) scale(1)',opacity:1},
    {transform:'translate('+dx*.2+'px,'+dy*.35+'px) rotate(6deg) scale(1.06)',opacity:1,offset:.3},
    {transform:'translate('+dx+'px,'+dy+'px) rotate(-10deg) scale(.2)',opacity:.9}
  ],{duration:460,easing:'cubic-bezier(.55,-.15,.25,1)',fill:'forwards'});
  later(()=>{
    cl.remove(); dim.apply(dim.items[dim.target]); ripple(152,150); later(done,320);
  },480);
}
function ripple(x,y){
  const ring=document.createElement('div'); ring.className='ring';
  ring.style.left=x+'px'; ring.style.top=y+'px';
  card.appendChild(ring); requestAnimationFrame(()=>ring.classList.add('go'));
  later(()=>ring.remove(),700);
}

/* ---------- 主流程 ---------- */
function run(){
  clear();
  reveal.classList.remove('on'); $('stamp').classList.remove('go');
  $('rchips').innerHTML=''; chips.innerHTML='';
  garments.classList.remove('instant'); hairRoot.classList.remove('instant');
  garments.querySelectorAll('.garm').forEach(g=>g.classList.remove('on'));
  hairRoot.querySelectorAll('.coif').forEach(h=>h.classList.remove('on'));
  waistband.classList.remove('on');
  curColor=null; paintColor(null); setText('今天穿什么');
  let t=0;
  DIMS.forEach((dim,di)=>{
    later(()=>{
      badge.textContent=dim.badge; dimLabel.textContent=dim.label;
      buildGrid(dim.items);
      shuffle(dim,()=>{
        const it=dim.items[dim.target];
        const c=document.createElement('div'); c.className='chip'; c.textContent=dim.chip(it);
        chips.appendChild(c); later(()=>c.classList.add('on'),20);
        if(di===DIMS.length-1){
          later(()=>setText('今天这一身'),200);
          later(()=>{
            rvs.textContent='uplook · 为你搭好的一身';
            const rc=$('rchips');
            DIMS.forEach(d2=>{ const e=document.createElement('div'); e.className='chip';
              e.textContent=d2.chip(d2.items[d2.target]); rc.appendChild(e);
              later(()=>e.classList.add('on'),60); });
            reveal.classList.add('on');
            later(()=>$('stamp').classList.add('go'),340);
          },820);
        }
      });
    },t);
    t+=1350;
  });
}

/* ---------- 控制 ---------- */
const PRESETS={fast:{sp:55,dr:1.5}, mid:{sp:70,dr:1.35}, slow:{sp:85,dr:1.25}};
function syncSliders(){ $('spv').textContent=sp.value+'ms';
  $('drv').textContent=(+dr.value).toFixed(2)+'×'; updHud(); }
waitSel.onchange=e=>{const p=PRESETS[e.target.value];sp.value=p.sp;dr.value=p.dr;syncSliders();run();};
sp.oninput=()=>syncSliders(); dr.oninput=()=>syncSliders();
$('replay').onclick=run;
rm.onchange=()=>document.body.classList.toggle('rm',rm.checked);
function updHud(){
  let d=+sp.value, tot=0, n=0;
  while(d<330&&n<16){tot+=d;d=Math.round(d*(+dr.value));n++;}
  const per=(tot+180+200+460+320)/1000;
  $('hud').textContent='每维度 ≈'+per.toFixed(1)+'s（'+n+' 次换位）· 一轮 ≈'+(per*4+2.4).toFixed(1)+'s';
}
syncSliders();
let iv=setInterval(()=>{if(auto.checked)run();},8600);
card.addEventListener('mouseenter',()=>clearInterval(iv));
card.addEventListener('mouseleave',()=>{clearInterval(iv);iv=setInterval(()=>{if(auto.checked)run();},8600);});
run();
</script>
</body>
</html>
