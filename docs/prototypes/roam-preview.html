<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>巡游段预览 · 20 帧循环</title>
<style>
  body{background:#E8E4DC;font-family:system-ui,-apple-system;margin:0;padding:28px;
       display:flex;flex-direction:column;align-items:center;gap:18px;color:#3F463C}
  .card{width:750px;height:560px;position:relative;overflow:hidden;border-radius:18px;
        background:#E8E4DC;box-shadow:0 10px 48px rgba(0,0,0,.14)}
  .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 38%)}
  .cap{position:absolute;left:30px;bottom:26px;color:#fff;font-size:21px;letter-spacing:.1em;
       text-shadow:0 1px 10px rgba(0,0,0,.4)}
  .ctl{display:flex;gap:20px;align-items:center;font-size:14px}
  .hud{font-variant-numeric:tabular-nums;opacity:.75}
  button{padding:7px 16px;border-radius:9px;border:1px solid #3F463C;background:transparent;
         color:#3F463C;cursor:pointer;font-size:14px}
  input[type=range]{width:180px}
</style>
</head>
<body>
  <div class="card">
    <img id="f" src="assets/frames-roam/f_01.jpg" alt="">
    <div class="veil"></div>
    <div class="cap" id="cap">在看搭配</div>
  </div>

  <div class="ctl">
    <button id="play">暂停</button>
    <label>每帧停留 <input type="range" id="sp" min="150" max="900" step="50" value="400">
      <span class="hud" id="spv">400ms</span></label>
    <span class="hud" id="hud">1 / 20</span>
  </div>
  <div class="ctl hud">一轮 <span id="dur">8.0</span>s · 20 帧 · 320KB · 750×560（卡片实际尺寸）</div>

<script>
  const N = 20, CAPS = ['在看搭配'];
  const frames = [];
  for (let i = 1; i <= N; i++) {
    const im = new Image();
    im.src = 'assets/frames-roam/f_' + String(i).padStart(2, '0') + '.jpg';
    frames.push(im);
  }
  const img = document.getElementById('f');
  const hud = document.getElementById('hud');
  const sp = document.getElementById('sp'), spv = document.getElementById('spv');
  const dur = document.getElementById('dur'), btn = document.getElementById('play');
  let i = 0, ms = 400, playing = true, t = null;

  function step() { i = (i + 1) % N; img.src = frames[i].src; hud.textContent = (i + 1) + ' / ' + N; }
  function loop() { if (playing) step(); t = setTimeout(loop, ms); }
  function upd() { ms = +sp.value; spv.textContent = ms + 'ms'; dur.textContent = (N * ms / 1000).toFixed(1); }

  sp.oninput = upd;
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '暂停' : '播放'; };
  upd(); loop();
</script>
</body>
</html>
