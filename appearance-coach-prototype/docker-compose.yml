services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jianwo
      POSTGRES_USER: jianwo
      POSTGRES_PASSWORD: jianwo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - jianwo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jianwo -d jianwo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADDR: ${ADDR:-:8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://jianwo:jianwo@postgres:5432/jianwo?sslmode=disable}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:58000}
      UPLOAD_DIR: ${UPLOAD_DIR:-data/uploads}
      ASSET_DIR: ${ASSET_DIR:-assets}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-true}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_API_BASE_URL: ${WECHAT_API_BASE_URL:-https://api.weixin.qq.com/sns/jscode2session}
      WECHAT_REQUEST_TIMEOUT_SECONDS: ${WECHAT_REQUEST_TIMEOUT_SECONDS:-5}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      ASSET_URL_TTL_SECONDS: ${ASSET_URL_TTL_SECONDS:-900}
      COS_BUCKET_URL: ${COS_BUCKET_URL:-}
      ASSET_BUCKET: ${ASSET_BUCKET:-}
      ASSET_S3_ENDPOINT: ${ASSET_S3_ENDPOINT:-}
      ASSET_REGION: ${ASSET_REGION:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_KEY_PREFIX: ${COS_KEY_PREFIX:-jianwo}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-demo}
      WEATHER_REQUEST_TIMEOUT_SECONDS: ${WEATHER_REQUEST_TIMEOUT_SECONDS:-5}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AMAP_API_BASE_URL: ${AMAP_API_BASE_URL:-https://restapi.amap.com/v3/weather/weatherInfo}
      AMAP_DEFAULT_CITY: ${AMAP_DEFAULT_CITY:-上海}
      AMAP_DEFAULT_ADCODE: ${AMAP_DEFAULT_ADCODE:-310000}
      RUN_WORKER: ${RUN_WORKER:-true}
      AI_ROUTING_FILE: ${AI_ROUTING_FILE:-}
      AI_ROUTING_JSON: ${AI_ROUTING_JSON:-}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      AI_FALLBACK_TO_DEMO: ${AI_FALLBACK_TO_DEMO:-true}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-5-mini}
      HAIR_PREVIEW_PROVIDER: ${HAIR_PREVIEW_PROVIDER:-demo}
      HAIR_PREVIEW_FALLBACK_TO_DEMO: ${HAIR_PREVIEW_FALLBACK_TO_DEMO:-true}
      HAIR_PREVIEW_TIMEOUT_SECONDS: ${HAIR_PREVIEW_TIMEOUT_SECONDS:-150}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-medium}
      OUTFIT_DIAGNOSIS_PROVIDER: ${OUTFIT_DIAGNOSIS_PROVIDER:-demo}
      OUTFIT_DIAGNOSIS_FALLBACK_TO_DEMO: ${OUTFIT_DIAGNOSIS_FALLBACK_TO_DEMO:-true}
      OUTFIT_DIAGNOSIS_TIMEOUT_SECONDS: ${OUTFIT_DIAGNOSIS_TIMEOUT_SECONDS:-60}
      OPENAI_OUTFIT_MODEL: ${OPENAI_OUTFIT_MODEL:-gpt-5-mini}
    ports:
      - "127.0.0.1:58000:8080"
    volumes:
      - jianwo_uploads:/app/data/uploads
      - ${AI_ROUTING_HOST_FILE:-./server/config/ai-routing.example.json}:/app/config/ai-routing.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  jianwo_pgdata:
  jianwo_uploads:
