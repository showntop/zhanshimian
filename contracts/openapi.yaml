# 「怎么打扮」API v1 契约（OpenAPI 3.1）
#
# 唯一权威：重实施计划 §一「API v1 端点总表」（49 端点）。
# 字段命名/类型/枚举以 apps/server/internal/domain/domain.go 为准（snake_case JSON）；
# 新增端点（auth/sms、auth/apple、auth/wechat-app、auth/session、me、me/profile、tasks、
# home/bootstrap、diagnostics、hairstyles、shares、plans/{id}/look/regenerate 等）
# 的字段按计划描述合理定义。
#
# 约定速览：
# - 成功响应统一包装为 {"data": ...}；失败统一为 {"error": {"code", "message", "request_id"}}；
# - 每个响应都带 X-Request-ID 响应头（中间件透传或自动生成）；
# - 异步创建统一返回 202/201，顶层附带 {"task": {"id", "type"}}，用 GET /v1/tasks/{id} 轮询；
# - 资源归属由鉴权隐含，越权访问一律 404（不泄露存在性）；
# - 幂等创建用 PUT，动作型幂等操作重复调用无副作用。
#
# 本文件的 paths 结构同时被 contracts/scripts/check-sync.mjs 依赖：
# 路径键缩进 2 空格、方法键缩进 4 空格，请勿改变缩进风格。

openapi: 3.1.0

info:
  title: 怎么打扮 API
  version: 1.0.0
  summary: 「怎么打扮」小程序 / 手机端 v1 接口契约
  description: |
    面向屏幕（BFF 聚合）而非面向表设计的 v1 契约：统一异步任务模型、幂等创建、
    资源化命名。全站仅 4 个动词子资源（/select、/activate、/wear、/apply），
    其余动作用常规资源语义表达。

    ## 响应包装
    - 成功：`{"data": <业务对象>}`；异步受理（202）与今日方案创建（201）额外在顶层附带
      `"task": {"id": "...", "type": "analysis|hair_preview|plan_look|today_look"}`。
    - 失败：`{"error": {"code": "...", "message": "...", "request_id": "..."}}`。
    - 所有响应携带 `X-Request-ID` 响应头；错误体内的 `request_id` 与之相同，用于排障关联。

    ## 错误码 ↔ HTTP 状态
    | code | HTTP | 场景 |
    |---|---|---|
    | validation_error | 400 | 参数或请求体校验失败 |
    | unauthorized | 401 | 未登录 / 会话过期 / 微信 code 无效（wechat_code_invalid） |
    | forbidden | 403 | 禁止的操作（保留码，当前契约内罕见） |
    | not_found | 404 | 资源不存在或越权（越权一律 404） |
    | wechat_code_invalid | 401 | 微信登录凭证被拒 |
    | wechat_login_limited | 429 | 微信侧登录限频 |
    | wechat_unavailable | 502 | 微信登录服务暂不可用 |
    | rate_limited | 429 | 短信/接口限频（短信 60s 冷却、10/min/IP、5/h/号） |
    | internal_error | 500 | 服务内部错误 |

    ## 轮询纪律（「该请求时才请求」）
    - 首页：单次 `GET /v1/home/bootstrap`；仅当 `active_tasks` 非空且页面可见时批量轮询
      `GET /v1/tasks?ids=`（1.5s），空闲零轮询。
    - 分析页：`GET /v1/tasks/{id}` 700ms，`onHide` 即停；进度 ≥90% 预取报告详情。
    - 方案页：列表内嵌 look 任务状态，仅存在进行中任务时 2500ms 轮询列表自身。
    - 发型预览 900ms；今日方案 3000ms。

    ## 公开端点（无需 Bearer）
    `GET /healthz`、`POST /v1/auth/*`、`GET /v1/shares/{token}`。
  license:
    name: UNLICENSED
    identifier: LicenseRef-UNLICENSED

servers:
  - url: 'https://{host}'
    description: 线上/预发网关（host 由部署环境注入）
    variables:
      host:
        default: api.zhanshimian.internal
        description: 网关域名占位符，本地开发请使用下方 127.0.0.1 服务地址
  - url: 'http://127.0.0.1:58000'
    description: 本地开发（docker-compose 暴露的服务端口）

tags:
  - name: Auth
    description: 认证与会话（微信/短信/Apple 多端登录、退出）
  - name: Me
    description: 账户、多端身份、补充资料与数据删除
  - name: Tasks
    description: 统一异步任务状态查询（所有 202/含 task 端点的轮询入口）
  - name: Home
    description: 首页一屏聚合（BFF）
  - name: Media
    description: 媒体上传与示例素材
  - name: Analysis
    description: 形象分析与报告
  - name: Plans
    description: 形象方案（三方案组、清单、反馈、单方案图重试）
  - name: Diagnostics
    description: 穿搭诊断（穿搭/购单品，同步）
  - name: Hair
    description: 发型推荐与试戴预览
  - name: Today
    description: 今日造型（上下文、方案、激活、反馈）
  - name: Shares
    description: 分享卡创建、公开访问与撤销
  - name: Wardrobe
    description: 衣橱单品与搭配
  - name: Advisor
    description: 形象顾问对话与建议动作
  - name: Events
    description: 产品埋点上报
  - name: System
    description: 系统探针（healthz）

# 全局默认：所有端点需要 Bearer 会话令牌；公开端点在各操作上以 security: [] 覆写。
security:
  - bearerAuth: []

paths:
  '/healthz':
    get:
      operationId: getHealth
      summary: 存活与就绪探针
      description: 返回运行环境、存储/天气/AI 能力路由概览与任务队列健康度（jobs）。公开端点，无需鉴权。
      tags: [System]
      security: []
      responses:
        '200':
          description: 服务存活；jobs 反映统一任务队列积压与失败情况
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        '405':
          description: 方法不允许（仅 GET；服务端路由对已注册路径的其他方法返回 405，非 JSON 错误包）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/auth/wechat':
    post:
      operationId: wechatLogin
      summary: 微信小程序 code 登录
      description: 用 wx.login 的 code 换取会话；code 无效返回 401 wechat_code_invalid，微信侧限频 429 wechat_login_limited，微信不可用 502 wechat_unavailable。公开端点。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 获取的登录凭证
                nickname:
                  type: string
                  description: 首次登录的昵称（已注册用户忽略）
      responses:
        '201':
          description: 登录成功，返回会话令牌与用户
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/auth/dev':
    post:
      operationId: devLogin
      summary: 开发环境快捷登录
      description: 仅开发/预发环境开放；生产环境固定返回 404 not_found。公开端点。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  description: 昵称（缺省自动生成）
      responses:
        '201':
          description: 登录成功，返回会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/auth/sms/request':
    post:
      operationId: requestSmsCode
      summary: 请求短信验证码
      description: 向手机号发送 6 位验证码。限频：60s 冷却、单 IP 10 条/分钟、单号 5 条/小时，超限返回 429 rate_limited；验证码仅以摘要存储。公开端点。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^1[0-9]{10}$'
                  description: 中国大陆手机号
      responses:
        '202':
          description: 验证码已受理下发；cooldown_seconds 内重复请求将被限频
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SmsRequestAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/auth/sms/verify':
    post:
      operationId: verifySmsCode
      summary: 短信验证码登录
      description: 校验验证码并登录/注册；手机号已绑定其他端（如 Apple 同号）时自动合并到同一账户，数据互通。验证码错误或过期返回 400 validation_error。公开端点。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  pattern: '^1[0-9]{10}$'
                  description: 中国大陆手机号
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: 6 位短信验证码
      responses:
        '201':
          description: 登录成功（或合并至已有账户），返回会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/auth/apple':
    post:
      operationId: appleLogin
      summary: iOS Apple 追加登录
      description: 以 Sign in with Apple 的 identityToken 登录；手机号与已有账户一致时自动合并（跨端数据互通）。identityToken 无效返回 401 unauthorized。公开端点。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token]
              properties:
                identity_token:
                  type: string
                  description: Sign in with Apple 返回的 identityToken
      responses:
        '201':
          description: 登录/合并成功，返回会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/auth/wechat-app':
    post:
      operationId: wechatAppLogin
      summary: Android 微信开放平台追加登录
      description: Android 端微信 SDK code 登录；错误语义与小程序登录一致（wechat_code_invalid / wechat_login_limited / wechat_unavailable）。公开端点。
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: 微信开放平台 OAuth code
                nickname:
                  type: string
                  description: 首次登录的昵称
      responses:
        '201':
          description: 登录成功，返回会话
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/auth/session':
    delete:
      operationId: logout
      summary: 退出登录
      description: 删除当前会话行（仅当前端，不影响其他端已登录会话）。幂等：会话已失效也返回 204。
      tags: [Auth]
      responses:
        '204':
          description: 已退出，无响应体
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/me':
    get:
      operationId: getMe
      summary: 当前账户与多端身份
      description: 返回账户信息与 identities 多端身份列表（wechat_miniapp / wechat_app / apple / phone），按绑定时间排序。
      tags: [Me]
      responses:
        '200':
          description: 账户与身份列表
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MeAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/me/profile':
    get:
      operationId: getMyProfile
      summary: 读取补充资料
      description: 返回身高/职业/预算与选填的体重、三围；从未填写时 data 为 null（客户端应引导进入资料页）。
      tags: [Me]
      responses:
        '200':
          description: 补充资料；未填写时 data 为 null
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/UserProfile'
                          - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateMyProfile
      summary: 保存补充资料
      description: 全量保存（幂等，重复提交同一资料结果一致）；身高/职业/预算必填，体重与三围选填。
      tags: [Me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
      responses:
        '200':
          description: 保存后的资料
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/me/data':
    delete:
      operationId: deleteMyData
      summary: 删除我的全部数据
      description: 注销清除：删除该用户全部业务数据与会话（含各端身份），立即生效且不可恢复，返回 204。
      tags: [Me]
      responses:
        '204':
          description: 已删除，无响应体
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/tasks':
    get:
      operationId: listTasks
      summary: 批量任务状态
      description: 首页任务横轨一次请求拉取多个任务（ids 逗号分隔，最多 20 个）；不存在的 id 直接忽略。仅 active_tasks 非空且页面可见时以 1.5s 轮询。
      tags: [Tasks]
      parameters:
        - name: ids
          in: query
          required: true
          description: 逗号分隔的任务 ID 列表
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
      responses:
        '200':
          description: 任务列表（按传入顺序返回存在的任务）
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/tasks/{id}':
    get:
      operationId: getTask
      summary: 单任务状态
      description: 统一轮询入口（分析 700ms / 方案图 2500ms / 发型 900ms / 今日 3000ms，页面隐藏即停）。照片不合格时 error.photo_reasons 逐图给出中文原因；完成后 result_ref 指向业务对象。
      tags: [Tasks]
      parameters:
        - name: id
          in: path
          required: true
          description: 任务 ID
          schema:
            type: string
      responses:
        '200':
          description: 任务当前状态
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/home/bootstrap':
    get:
      operationId: getHomeBootstrap
      summary: 首页一屏聚合
      description: 一次请求返回资料摘要、最新报告、今日方案、进行中任务与最近方案，替代旧首页 4 次并发请求；仅 active_tasks 非空且页面可见时才轮询任务。
      tags: [Home]
      responses:
        '200':
          description: 首页聚合数据；各字段在对应内容不存在时缺省
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/HomeBootstrap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  '/v1/media':
    post:
      operationId: uploadMedia
      summary: 上传照片
      description: multipart 直传（file + kind）；三图并行上传、单图失败单独重试。kind 决定后续用途校验（分析三图用 face/side/body）。超限或格式错误返回 400 validation_error。
      tags: [Media]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file:
                  type: string
                  format: binary
                  description: 图片文件（≤10MB）
                kind:
                  type: string
